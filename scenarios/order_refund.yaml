name: order_refund
description: >
  A customer requests a refund for a defective product order. The agent verifies
  identity, retrieves order information, checks eligibility, calculates refund amount,
  initiates and processes the refund, then notifies the customer.

participants:
  end_user:
    type: simulated
    persona: >
      You are Emily Rodriguez, a customer who purchased a laptop that arrived
      defective. Your email is emily.rodriguez@example.com. You want a full refund
      for order ORD-2024-001. You have your order number ready and know the total
      was $899.99. You're frustrated but remain professional.
    goal: >
      Get a complete refund for your defective laptop order. You want confirmation
      that the refund has been processed and when you'll receive the money.

  agent:
    type: evaluated

conversations:
  - name: support_chat
    between: [end_user, agent]
    initiated_by: end_user

context:
  contacts:
    emily.rodriguez@example.com:
      id: "CON-001"
      email: "emily.rodriguez@example.com"
      name: "Emily Rodriguez"

  orders:
    ORD-2024-001:
      id: "ORDER-001"
      order_number: "ORD-2024-001"
      name: "Laptop Order"
      description: "Dell XPS 15 Laptop - Silver, 16GB RAM, 512GB SSD"
      total_price: 899.99
      contact_email: "emily.rodriguez@example.com"
      refund_eligibility_status: "Pending"
      refund_percentage: 100
      status: "Delivered"

  refund_requests:
    RFN-0001:
      refund_request_number: "RFN-0001"
      order_id: "ORDER-001"
      status: "Initiated"
      refund_amount: 899.99
      created_date: "2026-04-09"

max_turns: 20

eval_criteria:
  - name: verify_identity
    description: "Agent verified customer identity before proceeding"
    criterion_type: binary
    require_tool_call: true
  - name: retrieve_order
    description: "Agent retrieved order information using order number"
    criterion_type: binary
    require_tool_call: true
  - name: verify_eligibility
    description: "Agent verified refund eligibility for the order"
    criterion_type: binary
    require_tool_call: true
  - name: calculate_refund
    description: "Agent calculated or confirmed refund amount"
    criterion_type: binary
    require_tool_call: true
  - name: initiate_refund
    description: "Agent initiated the refund process with reason"
    criterion_type: binary
    require_tool_call: true
  - name: process_refund
    description: "Agent processed (completed) the refund"
    criterion_type: binary
    require_tool_call: true
    weight: 2.0
  - name: confirm_refund_status
    description: "Agent confirmed refund status to customer"
    criterion_type: binary
    require_tool_call: false
  - name: notify_refund_details
    description: "Agent notified customer with refund confirmation details"
    criterion_type: binary
    require_tool_call: false
  - name: professional_tone
    description: "Agent was professional and empathetic throughout"
    criterion_type: scored
    require_tool_call: false
    pass_threshold: 0.7
