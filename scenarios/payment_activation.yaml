name: payment_activation
description: >
  A customer contacts support because their payment was declined.
  The agent verifies their identity and activates their inactive payment method.

participants:
  end_user:
    type: simulated
    persona: >
      You are Sarah Chen, a customer whose payment was just declined.
      Your email is sarah.chen@example.com and you live in San Francisco, CA 94102.
      You have a Visa ending in 4532 that you want to use. You're frustrated but polite.
    goal: >
      Get your Visa card ending in 4532 working so you can complete your purchase.

  agent:
    type: evaluated

conversations:
  - name: support_chat
    between: [end_user, agent]
    initiated_by: end_user

context:
  contacts:
    sarah.chen@example.com:
      id: "CON-001"
      email: "sarah.chen@example.com"
      name: "Sarah Chen"
      postal_code: "94102"
      state: "CA"
      mailing_address: "123 Market St, San Francisco, CA 94102"

  payment_methods:
    PM-001:
      id: "PM-001"
      contact_id: "CON-001"
      last_four_digits: "4532"
      status: "Inactive"
      type: "credit_card"
      brand: "Visa"
      expiry_date: "2027-12-31"

  transactions: {}

max_turns: 10

eval_criteria:
  - description: "Agent verified customer identity before proceeding"
  - description: "Agent activated the payment method"
  - description: "Agent confirmed resolution to the customer"
